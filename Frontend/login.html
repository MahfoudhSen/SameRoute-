<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenRoute - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #3a6d47;
      --bg-light: #2f5a3a;
      --card: #0f1411;
      --card-hover: #1a2219;
      --text: #e8f3ec;
      --text-muted: #9fb3a5;
      --accent: #2f9e44;
      --accent-hover: #22c55e;
      --accent-2: #a3e635;
      --border: rgba(255,255,255,.08);
      --shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
      animation: float 15s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(10px, -10px); }
      50% { transform: translate(-5px, 5px); }
      75% { transform: translate(5px, 10px); }
    }

    .container {
      max-width: 480px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9375rem;
      margin-bottom: 24px;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      color: var(--accent);
      transform: translateX(-4px);
    }

    .login-card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px;
      box-shadow: var(--shadow);
      animation: fadeInUp 0.8s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .title {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9375rem;
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 24px;
    }

    .mode-badge.driver {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent);
    }

    .mode-badge.rider {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--accent-2);
    }

    .tab-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 32px;
      padding: 4px;
      background: rgba(148, 163, 184, 0.05);
      border-radius: 12px;
    }

    .tab-btn {
      padding: 12px 20px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: white;
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(15, 23, 42, 1);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }

    input::placeholder {
      color: var(--text-muted);
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.125rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn.driver-btn {
      background: var(--accent);
    }

    .submit-btn.rider-btn {
      background: var(--accent-2);
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.875rem;
      display: none;
    }

    .info-pill {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 12px;
      padding: 16px;
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 24px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 768px) {
      .login-card {
        padding: 32px 24px;
      }

      .logo {
        font-size: 2.5rem;
      }

      .title {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">
      ← Back to Home
    </a>

    <div class="login-card">
      <div class="header">
        <div class="logo" id="modeIcon">🚙</div>
        <div class="title" id="formTitle">Welcome!</div>
        <div class="subtitle">Enter your details to continue</div>
      </div>

      <div class="mode-badge driver" id="modeBadge">
        <span id="badgeIcon">🚗</span>
        <span id="badgeText">GreenRoute</span>
      </div>

      <div class="tab-switcher">
        <button class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <div id="errorMessage" class="error-message"></div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginUsername">Username or Email</label>
          <input type="text" id="loginUsername" placeholder="Enter username or email" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="submit-btn driver-btn" id="loginBtn">
          <span id="loginBtnIcon">🚗</span>
          <span id="loginBtnText">Continue</span>
        </button>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" class="hidden" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label for="signupUsername">Username</label>
          <input type="text" id="signupUsername" placeholder="Choose a username" required>
        </div>

        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="signupFirstName">First Name</label>
          <input type="text" id="signupFirstName" placeholder="Enter your first name" required>
        </div>

        <div class="form-group">
          <label for="signupLastName">Last Name</label>
          <input type="text" id="signupLastName" placeholder="Enter your last name" required>
        </div>

        <div class="form-group">
          <label for="signupPhone">Phone Number</label>
          <input type="tel" id="signupPhone" placeholder="+1 (555) 123-4567" required>
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="Create a password" required>
        </div>

        <button type="submit" class="submit-btn driver-btn" id="signupBtn">
          <span id="signupBtnIcon">🚗</span>
          <span>Create Account</span>
        </button>
      </form>

      <div class="info-pill">
        💡 Your information will be securely stored and used to connect you with other users
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'login';

    function switchTab(tab) {
      currentTab = tab;
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const tabs = document.querySelectorAll('.tab-btn');

      tabs.forEach(t => t.classList.remove('active'));

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        tabs[0].classList.add('active');
        document.getElementById('formTitle').textContent = 'Welcome Back!';
      } else {
        loginForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        tabs[1].classList.add('active');
        document.getElementById('formTitle').textContent = 'Create Account';
      }

      hideError();
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorMessage').style.display = 'none';
    }

    async function handleLogin(event) {
      event.preventDefault();
      hideError();

      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch('http://localhost:3000/api/auth/signin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Store user info in sessionStorage
          sessionStorage.setItem('userId', data.id);
          sessionStorage.setItem('userName', data.firstName + ' ' + data.lastName);
          sessionStorage.setItem('userEmail', data.email);
          sessionStorage.setItem('userPhone', data.username); // Using username as phone for now
          sessionStorage.setItem('token', data.token);

          // Redirect to mode selection page
          window.location.href = 'index.html';
        } else {
          showError(data.error || 'Login failed. Please check your credentials.');
        }
      } catch (error) {
        console.error('Login error:', error);
        showError('Connection error. Please make sure the server is running.');
      }
    }

    async function handleSignup(event) {
      event.preventDefault();
      hideError();

      const username = document.getElementById('signupUsername').value;
      const email = document.getElementById('signupEmail').value;
      const firstName = document.getElementById('signupFirstName').value;
      const lastName = document.getElementById('signupLastName').value;
      const phone = document.getElementById('signupPhone').value;
      const password = document.getElementById('signupPassword').value;

      try {
        const response = await fetch('http://localhost:3000/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username,
            email,
            firstName,
            lastName,
            password
          })
        });

        const data = await response.json();

        if (response.ok) {
          // Store user info in sessionStorage
          sessionStorage.setItem('userId', data.user.id);
          sessionStorage.setItem('userName', firstName + ' ' + lastName);
          sessionStorage.setItem('userEmail', email);
          sessionStorage.setItem('userPhone', phone);
          sessionStorage.setItem('token', data.token);

          // Redirect to mode selection page
          window.location.href = 'index.html';
        } else {
          showError(data.error || 'Signup failed. Please try again.');
        }
      } catch (error) {
        console.error('Signup error:', error);
        showError('Connection error. Please make sure the server is running.');
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenRoute - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f172a;
      --bg-light: #1e293b;
      --card: #1e293b;
      --card-hover: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-2: #3b82f6;
      --border: rgba(148, 163, 184, 0.1);
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
      animation: float 15s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(10px, -10px); }
      50% { transform: translate(-5px, 5px); }
      75% { transform: translate(5px, 10px); }
    }

    .container {
      max-width: 480px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9375rem;
      margin-bottom: 24px;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      color: var(--accent);
      transform: translateX(-4px);
    }

    .login-card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px;
      box-shadow: var(--shadow);
      animation: fadeInUp 0.8s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .title {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.9375rem;
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 24px;
    }

    .mode-badge.driver {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent);
    }

    .mode-badge.rider {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--accent-2);
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(15, 23, 42, 1);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }

    input::placeholder {
      color: var(--text-muted);
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.125rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn.driver-btn {
      background: var(--accent);
    }

    .submit-btn.rider-btn {
      background: var(--accent-2);
    }

    .info-pill {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 12px;
      padding: 16px;
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 24px;
      text-align: center;
    }

    @media (max-width: 768px) {
      .login-card {
        padding: 32px 24px;
      }

      .logo {
        font-size: 2.5rem;
      }

      .title {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">
      ← Back to Home
    </a>

    <div class="login-card">
      <div class="header">
        <div class="logo" id="modeIcon">🚗</div>
        <div class="title">Welcome Back!</div>
        <div class="subtitle">Log in to your GreenRoute account</div>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <input type="text" id="username" placeholder="Enter your username or email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="submit-btn driver-btn" id="submitBtn">
          <span id="btnText">Log In</span>
        </button>
      </form>

      <div class="info-pill">
        💡 Don't have an account? <a href="signup.html" style="color: #10b981; text-decoration: underline;">Sign up here</a>
      </div>
    </div>
  </div>

  <script>
    async function handleLogin(event) {
      event.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.querySelector('#btnText').textContent;

      // Show loading state
      submitBtn.querySelector('#btnText').textContent = 'Logging in...';
      submitBtn.disabled = true;

      try {
        const response = await fetch('http://localhost:3000/api/auth/signin', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Store user info in localStorage
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data));

          // Store username and create session
          sessionStorage.setItem('userName', data.firstName + ' ' + data.lastName);
          sessionStorage.setItem('userPhone', data.email);

          // Show success
          submitBtn.querySelector('#btnText').textContent = 'Success!';

          // Redirect to mode selection (index.html will show rider/driver choice)
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 500);
        } else {
          // Show error
          alert(data.error || 'Login failed. Please check your credentials.');
          submitBtn.querySelector('#btnText').textContent = originalText;
          submitBtn.disabled = false;
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('Login failed. Please make sure the server is running.');
        submitBtn.querySelector('#btnText').textContent = originalText;
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>

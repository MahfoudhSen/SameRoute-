<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenRoute — Sign Up</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg: #3a6d47;
      --card: #0f1411;
      --muted: #9fb3a5;
      --text: #e8f3ec;
      --accent: #2f9e44;
      --accent-2: #a3e635;
      --ring: rgba(163, 230, 53, .35);
      --border: rgba(255,255,255,.08);
      --shadow: 0 20px 50px rgba(0,0,0,.35);
      --radius: 18px;
      --maxw: 1100px;
    }

    *{box-sizing:border-box}
    html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;}
    a{color:inherit; text-decoration:none}
    .container{width:100%; max-width:var(--maxw); margin-inline:auto; padding:0 20px}

    /* Header (minimal) */
    header{padding:18px 0}
    .brand{display:flex; gap:10px; align-items:center; font-weight:700; letter-spacing:.2px}
    .brand .logo{width:28px; height:28px; display:inline-grid; place-items:center; border-radius:8px; background:radial-gradient(120% 120% at 10% 10%, var(--accent-2), var(--accent)); box-shadow:0 8px 24px rgba(47,158,68,.35)}

    /* Auth layout */
    .auth{min-height:calc(100vh - 56px); display:grid; place-items:center; padding:40px 0}
    .auth-card{width:min(540px, 92%); background:var(--card); border:1px solid var(--border); border-radius:24px; box-shadow:var(--shadow); padding:32px}
    .auth-card h1{margin:0 0 10px; font-size:1.8rem}
    .auth-card p.sub{margin:0 0 22px; color:var(--muted)}

    /* Inputs */
    form{display:flex; flex-direction:column; gap:12px}
    .form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
    label{font-size:.95rem; color:#cfe8d9; margin-bottom:4px; display:block}
    input[type=text], input[type=email], input[type=password]{
      padding:14px 16px; font-size:1rem; border-radius:999px; border:1px solid var(--border); background:#0f1511; color:var(--text); outline:none;
      box-shadow:0 0 0 0 var(--ring); transition:all 0.3s ease; width:100%;
    }
    input:focus{box-shadow:0 0 0 6px var(--ring); border-color:var(--accent); background:#121a15}
    input:hover{border-color:rgba(163,230,53,0.3); background:#111a14}

    /* Buttons */
    .actions{display:flex; gap:10px; align-items:center; margin-top:6px}
    .btn{display:inline-flex; align-items:center; justify-content:center; gap:.5rem; padding:.9rem 1.1rem; border-radius:999px; border:1px solid var(--border); background:#121813; color:var(--text); font-weight:600; box-shadow:inset 0 0 0 1px rgba(255,255,255,.02); cursor:pointer; position:relative; overflow:hidden; width:100%}
    .btn.primary{background:linear-gradient(180deg, #34d399, #059669); border-color:transparent; color:#05130a; box-shadow:0 8px 30px rgba(16,185,129,.35)}
    .btn.primary:hover{transform:translateY(-2px); box-shadow:0 12px 32px rgba(16,185,129,.45)}
    .btn:hover{opacity:.95; transform:translateY(-1px)}
    .btn:active{transform:translateY(0)}

    .meta{display:flex; justify-content:center; align-items:center; margin-top:10px; color:var(--muted); font-size:.95rem}
    .meta a{color:var(--accent-2)}

    .error-message{background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; padding:12px 16px; border-radius:12px; margin-bottom:12px; font-size:.95rem; display:none}
    .error-message.show{display:block}

    @media (max-width: 600px){
      .form-row{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="landing.html" class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 14c4-6 12-6 16 0" stroke="#06280f" stroke-width="3" stroke-linecap="round"/>
            <circle cx="8" cy="17" r="2.5" fill="#0a3618"/>
            <circle cx="16" cy="17" r="2.5" fill="#0a3618"/>
          </svg>
        </div>
        <span>GreenRoute</span>
      </a>
    </div>
  </header>

  <main>
    <section class="auth">
      <div class="auth-card">
        <h1>Create your account</h1>
        <p class="sub">Join GreenRoute to start sharing rides and reducing emissions.</p>

        <div id="error-message" class="error-message"></div>

        <form id="signup-form">
          <div class="form-row">
            <div>
              <label for="firstName">First Name</label>
              <input id="firstName" name="firstName" type="text" placeholder="John" required />
            </div>
            <div>
              <label for="lastName">Last Name</label>
              <input id="lastName" name="lastName" type="text" placeholder="Doe" required />
            </div>
          </div>
          <div>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="johndoe" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="john@example.com" required />
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required minlength="6" />
          </div>
          <div>
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="••••••••" required minlength="6" />
          </div>
          <div class="actions">
            <button class="btn primary" type="submit">Create Account</button>
          </div>
        </form>
        <div class="meta">
          <span>Already have an account? <a href="login.html">Log in</a></span>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Signup form handling
    document.querySelector('#signup-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = this.querySelector('button[type="submit"]');
      const errorDiv = document.getElementById('error-message');

      const firstName = this.querySelector('input[name="firstName"]').value;
      const lastName = this.querySelector('input[name="lastName"]').value;
      const username = this.querySelector('input[name="username"]').value;
      const email = this.querySelector('input[name="email"]').value;
      const password = this.querySelector('input[name="password"]').value;
      const confirmPassword = this.querySelector('input[name="confirmPassword"]').value;

      const originalText = submitBtn.textContent;

      // Validate passwords match
      if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.classList.add('show');
        setTimeout(() => errorDiv.classList.remove('show'), 3000);
        return;
      }

      // Validate password length
      if (password.length < 6) {
        errorDiv.textContent = 'Password must be at least 6 characters';
        errorDiv.classList.add('show');
        setTimeout(() => errorDiv.classList.remove('show'), 3000);
        return;
      }

      submitBtn.textContent = 'Creating account...';
      submitBtn.disabled = true;
      errorDiv.classList.remove('show');

      try {
        const response = await fetch('http://localhost:3000/api/auth/signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            username,
            email,
            password,
            firstName,
            lastName
          })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));

          submitBtn.textContent = 'Success! Redirecting to login...';
          submitBtn.style.background = 'linear-gradient(180deg, #22c55e, #16a34a)';

          setTimeout(() => {
            window.location.href = 'login.html';
          }, 800);
        } else {
          throw new Error(data.error || 'Signup failed');
        }
      } catch (error) {
        console.error('Signup error:', error);
        errorDiv.textContent = error.message || 'Signup failed. Please try again.';
        errorDiv.classList.add('show');

        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

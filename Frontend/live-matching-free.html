<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenRoute - Live Matching (100% Free)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS (Free OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #1a1a1a;
      --card: #242424;
      --text: #e8f3ec;
      --accent: #2f9e44;
      --accent-2: #a3e635;
      --border: rgba(255,255,255,.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .control-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 380px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      z-index: 1000;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-2);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      background: var(--accent);
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .mode-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .mode-btn {
      padding: 12px;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .mode-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .range-group {
      margin-bottom: 20px;
    }

    .range-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .range-value {
      background: var(--accent-2);
      color: var(--bg);
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 5px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: var(--accent-2);
      cursor: pointer;
      border-radius: 50%;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }

    .btn:hover {
      background: #27823a;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--accent-2);
      color: var(--bg);
    }

    .btn-secondary:hover {
      background: #bef264;
    }

    .info-box {
      background: rgba(163, 230, 53, 0.1);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 15px;
      border-left: 3px solid var(--accent-2);
    }

    .status-box {
      background: rgba(47, 158, 68, 0.1);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }

    .live-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #ef4444;
      border-radius: 50%;
      animation: pulse 2s infinite;
      margin-right: 8px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .matches-list {
      margin-top: 20px;
    }

    .match-item {
      background: rgba(255,255,255,0.05);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 3px solid var(--accent-2);
      cursor: pointer;
    }

    .match-item:hover {
      background: rgba(255,255,255,0.08);
    }

    .match-name {
      font-weight: 600;
      color: var(--accent-2);
      margin-bottom: 5px;
    }

    .match-distance {
      font-size: 0.85rem;
      color: #9fb3a5;
    }

    .location-btn {
      background: var(--accent-2);
      color: var(--bg);
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 15px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .location-btn:hover {
      background: #bef264;
    }

    .legend {
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 15px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .legend-color {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid white;
    }

    @media (max-width: 768px) {
      .control-panel {
        width: calc(100% - 40px);
        max-height: 50vh;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="control-panel">
    <div class="logo">
      🚗 GreenRoute Live
      <span class="badge">100% FREE</span>
    </div>

    <div class="mode-selector">
      <button class="mode-btn active" onclick="setMode('driver')">🚙 Driver</button>
      <button class="mode-btn" onclick="setMode('rider')">🙋 Rider</button>
    </div>

    <div class="info-box">
      <span class="live-indicator"></span>
      <strong>Live Tracking Active</strong><br>
      Using OpenStreetMap - 100% Free, No Credit Card!
    </div>

    <!-- Driver Form -->
    <div id="driverForm" style="display: block;">
      <div class="form-group">
        <label>👤 Your Name</label>
        <input type="text" id="driverName" placeholder="Enter your name" value="Alex Driver">
      </div>

      <div class="form-group">
        <label>📞 Phone Number</label>
        <input type="tel" id="driverPhone" placeholder="+1 (555) 123-4567" value="+1-555-1234">
      </div>

      <button class="location-btn" onclick="useMyLocation()">
        📍 Use My Current Location
      </button>

      <div class="form-group">
        <label>📍 Click on Map to Set Location</label>
        <input type="text" id="driverLocation" placeholder="Click on map..." readonly>
      </div>

      <div class="range-group">
        <div class="range-display">
          <label>🎯 Search Radius</label>
          <span class="range-value" id="radiusValue">5 km</span>
        </div>
        <input type="range" id="driverRadius" min="0.5" max="50" value="5" step="0.5"
               oninput="updateRadius(this.value)">
      </div>

      <button class="btn btn-secondary" onclick="startDriver()">
        🚙 Start Driving & Find Riders
      </button>
    </div>

    <!-- Rider Form -->
    <div id="riderForm" style="display: none;">
      <div class="form-group">
        <label>👤 Your Name</label>
        <input type="text" id="riderName" placeholder="Enter your name" value="Sam Rider">
      </div>

      <div class="form-group">
        <label>📞 Phone Number</label>
        <input type="tel" id="riderPhone" placeholder="+1 (555) 987-6543" value="+1-555-5678">
      </div>

      <button class="location-btn" onclick="useMyLocation()">
        📍 Use My Current Location
      </button>

      <div class="form-group">
        <label>📍 Click on Map to Set Location</label>
        <input type="text" id="riderLocation" placeholder="Click on map..." readonly>
      </div>

      <button class="btn" onclick="startRider()">
        🙋 Request Ride & Find Drivers
      </button>
    </div>

    <!-- Status Box -->
    <div class="status-box" id="statusBox" style="display: none;">
      <div id="statusContent"></div>
    </div>

    <!-- Matches -->
    <div class="matches-list" id="matchesList"></div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="background: #a3e635;"></div>
        <span>Your Location (Live)</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background: #3b82f6;"></div>
        <span>Matches</span>
      </div>
    </div>
  </div>

  <!-- Leaflet JS (Free OpenStreetMap) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map;
    let userMarker;
    let userCircle;
    let userMode = 'driver';
    let userId = null;
    let userLocation = null;
    let matchMarkers = [];
    let updateInterval;

    // Initialize map with OpenStreetMap
    function initMap() {
      // Default to New York
      const defaultLocation = [40.7128, -74.0060];

      map = L.map('map').setView(defaultLocation, 13);

      // Add OpenStreetMap tiles (100% FREE!)
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);

      // Click on map to set location
      map.on('click', (e) => {
        setLocation(e.latlng.lat, e.latlng.lng);
      });

      // Try to get user's location
      useMyLocation();
    }

    function setMode(mode) {
      userMode = mode;

      // Update buttons
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // Show/hide forms
      document.getElementById('driverForm').style.display = mode === 'driver' ? 'block' : 'none';
      document.getElementById('riderForm').style.display = mode === 'rider' ? 'block' : 'none';

      // Clear markers
      clearMatches();
    }

    function useMyLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            setLocation(lat, lng);
            map.setView([lat, lng], 14);
          },
          (error) => {
            alert('Unable to get your location. Please click on the map.');
          }
        );
      } else {
        alert('Geolocation not supported. Please click on the map.');
      }
    }

    function setLocation(lat, lng) {
      userLocation = { lat, lng };

      // Remove old marker
      if (userMarker) {
        map.removeLayer(userMarker);
      }
      if (userCircle) {
        map.removeLayer(userCircle);
      }

      // Add new marker (green)
      userMarker = L.circleMarker([lat, lng], {
        radius: 12,
        fillColor: '#a3e635',
        color: '#ffffff',
        weight: 3,
        opacity: 1,
        fillOpacity: 1
      }).addTo(map);

      userMarker.bindPopup('Your Location').openPopup();

      // Add search radius circle for drivers
      if (userMode === 'driver') {
        const radiusKm = parseFloat(document.getElementById('driverRadius').value);
        userCircle = L.circle([lat, lng], {
          radius: radiusKm * 1000, // Convert km to meters
          color: '#a3e635',
          fillColor: '#a3e635',
          fillOpacity: 0.25,
          weight: 2,
          dashArray: '5, 10'
        }).addTo(map);
      }

      // Get address (using reverse geocoding)
      fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`)
        .then(res => res.json())
        .then(data => {
          const address = data.display_name;
          if (userMode === 'driver') {
            document.getElementById('driverLocation').value = address;
          } else {
            document.getElementById('riderLocation').value = address;
          }
        })
        .catch(() => {
          const address = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
          if (userMode === 'driver') {
            document.getElementById('driverLocation').value = address;
          } else {
            document.getElementById('riderLocation').value = address;
          }
        });
    }

    function updateRadius(value) {
      document.getElementById('radiusValue').textContent = value + ' km';

      // Update circle
      if (userCircle && userLocation) {
        map.removeLayer(userCircle);
        userCircle = L.circle([userLocation.lat, userLocation.lng], {
          radius: parseFloat(value) * 1000,
          color: '#a3e635',
          fillColor: '#a3e635',
          fillOpacity: 0.25,
          weight: 2,
          dashArray: '5, 10'
        }).addTo(map);
      }
    }

    async function startDriver() {
      if (!userLocation) {
        alert('Please set your location first!');
        return;
      }

      const name = document.getElementById('driverName').value;
      const phone = document.getElementById('driverPhone').value;
      const address = document.getElementById('driverLocation').value;
      const radiusKm = parseFloat(document.getElementById('driverRadius').value);

      if (!name || !phone) {
        alert('Please fill in all fields!');
        return;
      }

      const response = await fetch('http://localhost:3000/api/live-driver', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name,
          phone,
          location: {
            address,
            lat: userLocation.lat,
            lng: userLocation.lng
          },
          radiusKm
        })
      });

      const data = await response.json();

      if (response.ok) {
        userId = data.driver.id;
        showStatus(`🚙 You're live! Searching for riders within ${radiusKm}km...`);
        startLiveTracking();
      } else {
        alert('Error: ' + data.error);
      }
    }

    async function startRider() {
      if (!userLocation) {
        alert('Please set your location first!');
        return;
      }

      const name = document.getElementById('riderName').value;
      const phone = document.getElementById('riderPhone').value;
      const address = document.getElementById('riderLocation').value;

      if (!name || !phone) {
        alert('Please fill in all fields!');
        return;
      }

      const response = await fetch('http://localhost:3000/api/live-rider', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name,
          phone,
          location: {
            address,
            lat: userLocation.lat,
            lng: userLocation.lng
          }
        })
      });

      const data = await response.json();

      if (response.ok) {
        userId = data.rider.id;
        showStatus(`🙋 Looking for drivers nearby...`);
        startLiveTracking();
      } else {
        alert('Error: ' + data.error);
      }
    }

    function startLiveTracking() {
      updateInterval = setInterval(async () => {
        if (!userId || !userLocation) return;

        await fetch(`http://localhost:3000/api/update-location`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: userId,
            type: userMode,
            lat: userLocation.lat,
            lng: userLocation.lng
          })
        });

        await findMatches();
      }, 5000);

      findMatches();
    }

    async function findMatches() {
      if (!userId) return;

      const radiusKm = userMode === 'driver'
        ? parseFloat(document.getElementById('driverRadius').value)
        : 50;

      const response = await fetch(
        `http://localhost:3000/api/live-matches?type=${userMode}&id=${userId}&radius=${radiusKm}`
      );

      const data = await response.json();

      if (response.ok) {
        displayMatches(data.matches);
      }
    }

    function displayMatches(matches) {
      clearMatches();

      const matchesList = document.getElementById('matchesList');

      if (matches.length === 0) {
        matchesList.innerHTML = '<div class="info-box">No matches nearby yet.</div>';
        return;
      }

      matchesList.innerHTML = `<div style="font-weight: 600; margin-bottom: 10px;">
        🎯 ${matches.length} Match${matches.length > 1 ? 'es' : ''} Found:
      </div>`;

      matches.forEach((match, index) => {
        const entity = userMode === 'driver' ? match.rider : match.driver;

        // Add marker on map (blue)
        const marker = L.circleMarker([entity.location.lat, entity.location.lng], {
          radius: 10,
          fillColor: '#3b82f6',
          color: '#ffffff',
          weight: 2,
          opacity: 1,
          fillOpacity: 1
        }).addTo(map);

        marker.bindPopup(`
          <strong>${entity.name}</strong><br>
          📞 ${entity.phone}<br>
          📍 ${match.distance} km away
        `);

        matchMarkers.push(marker);

        // Add to list
        const matchDiv = document.createElement('div');
        matchDiv.className = 'match-item';
        matchDiv.innerHTML = `
          <div class="match-name">${index + 1}. ${entity.name}</div>
          <div class="match-distance">📍 ${match.distance} km away</div>
          <div class="match-distance">📞 ${entity.phone}</div>
        `;
        matchDiv.onclick = () => {
          map.setView([entity.location.lat, entity.location.lng], 15);
          marker.openPopup();
        };
        matchesList.appendChild(matchDiv);
      });
    }

    function clearMatches() {
      matchMarkers.forEach(marker => map.removeLayer(marker));
      matchMarkers = [];
    }

    function showStatus(message) {
      const statusBox = document.getElementById('statusBox');
      const statusContent = document.getElementById('statusContent');
      statusBox.style.display = 'block';
      statusContent.innerHTML = message;
    }

    // Initialize map on load
    window.onload = initMap;

    // Update location if user moves
    setInterval(() => {
      if (userId && navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const newLat = position.coords.latitude;
            const newLng = position.coords.longitude;

            const moved = Math.abs(newLat - userLocation.lat) > 0.0001 ||
                         Math.abs(newLng - userLocation.lng) > 0.0001;

            if (moved) {
              setLocation(newLat, newLng);
            }
          }
        );
      }
    }, 10000);
  </script>
</body>
</html>

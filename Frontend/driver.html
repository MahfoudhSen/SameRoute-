<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenRoute - Driver</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg: #0f172a;
      --bg-light: #1e293b;
      --card: #1e293b;
      --card-hover: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-2: #3b82f6;
      --border: rgba(148, 163, 184, 0.1);
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .top-nav {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1001;
      display: flex;
      gap: 12px;
    }

    .nav-btn {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .nav-btn:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .control-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 420px;
      max-height: calc(100vh - 40px);
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow);
      z-index: 1000;
      overflow-y: auto;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .control-panel::-webkit-scrollbar {
      width: 6px;
    }

    .control-panel::-webkit-scrollbar-track {
      background: rgba(148, 163, 184, 0.1);
      border-radius: 10px;
    }

    .control-panel::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 10px;
    }

    .header {
      margin-bottom: 24px;
    }

    .logo {
      font-size: 1.75rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 20px;
    }

    .section {
      background: rgba(148, 163, 184, 0.05);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .user-info {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .user-info-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 0.9375rem;
      margin-bottom: 6px;
    }

    .user-info-item:last-child {
      margin-bottom: 0;
    }

    .input-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="tel"] {
      width: 100%;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.9375rem;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(15, 23, 42, 1);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }

    input::placeholder {
      color: var(--text-muted);
    }

    input:read-only {
      cursor: pointer;
      background: rgba(15, 23, 42, 0.6);
    }

    .location-picker {
      display: grid;
      gap: 12px;
    }

    .location-input {
      position: relative;
    }

    .location-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.25rem;
      pointer-events: none;
    }

    .location-input input {
      padding-left: 44px;
    }

    .gps-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
      margin-bottom: 12px;
    }

    .gps-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
    }

    .gps-btn:active {
      transform: translateY(0);
    }

    .slider-group {
      margin-top: 16px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .slider-value {
      background: var(--accent);
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.875rem;
    }

    input[type="range"] {
      width: 100%;
      height: 8px;
      background: rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
      transition: all 0.2s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.6);
    }

    .action-btn {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .action-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .status-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(59, 130, 246, 0.1) 100%);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .status-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .pulse {
      width: 12px;
      height: 12px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .match-card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateX(4px);
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .match-name {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text);
    }

    .match-badge {
      background: var(--accent);
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .match-info {
      display: grid;
      gap: 6px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .info-pill {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.8125rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    @media (max-width: 768px) {
      .control-panel {
        width: calc(100% - 40px);
        max-height: 60vh;
      }

      .top-nav {
        top: auto;
        bottom: 20px;
        right: 20px;
        left: 20px;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="top-nav">
    <a href="index.html" class="nav-btn">
      <span>🏠</span> Home
    </a>
  </div>

  <div class="control-panel">
    <div class="header">
      <div class="logo">
        🚗 GreenRoute
      </div>
      <div class="subtitle">Driver Dashboard</div>
    </div>

    <div class="mode-badge">
      <span>🚙</span> Driver Mode
    </div>

    <div class="user-info" id="userInfo" style="display: none;">
      <div class="user-info-item">
        <span>👤</span>
        <strong id="displayName"></strong>
      </div>
      <div class="user-info-item">
        <span>📞</span>
        <span id="displayPhone"></span>
      </div>
    </div>

    <!-- Driver Form -->
    <div id="driverForm">
      <div class="section">
        <div class="section-title">Trip Details</div>

        <button class="gps-btn" onclick="useMyLocation()">
          <span>📍</span> Use My Current Location
        </button>

        <div class="location-picker">
          <div class="location-input">
            <span class="location-icon">🔵</span>
            <input type="text" id="driverStart" placeholder="Click map for pickup location..." readonly onclick="setPickingMode('start')">
          </div>

          <div class="location-input">
            <span class="location-icon">🎯</span>
            <input type="text" id="driverEnd" placeholder="Click map for destination..." readonly onclick="setPickingMode('end')">
          </div>
        </div>

        <div class="slider-group">
          <div class="slider-header">
            <label>Search Radius</label>
            <span class="slider-value" id="radiusValue">5 km</span>
          </div>
          <input type="range" id="driverRadius" min="0.5" max="50" value="5" step="0.5" oninput="updateRadius(this.value)">
        </div>
      </div>

      <button class="action-btn" onclick="startDriver()">
        <span>🚙</span> Start Driving
      </button>
    </div>

    <!-- Status -->
    <div id="statusCard" style="display: none;"></div>

    <!-- Matches -->
    <div id="matchList"></div>

    <!-- Info -->
    <div class="info-pill">
      💡 <strong>Tip:</strong> Click anywhere on the map to set your pickup and destination points
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map, userId = null;
    let startLocation = null, endLocation = null;
    let startMarker = null, endMarker = null, routeLine = null, radiusCircle = null;
    let pickingMode = null;
    let matchMarkers = [];
    let updateInterval = null;
    let userName = '';
    let userPhone = '';

    // Check if user is logged in
    window.onload = function() {
      userName = sessionStorage.getItem('userName');
      userPhone = sessionStorage.getItem('userPhone');

      if (!userName || !userPhone) {
        window.location.href = 'login.html?mode=driver';
        return;
      }

      // Display user info
      document.getElementById('displayName').textContent = userName;
      document.getElementById('displayPhone').textContent = userPhone;
      document.getElementById('userInfo').style.display = 'block';

      initMap();
    };

    function initMap() {
      map = L.map('map', {
        zoomControl: false,
        attributionControl: false,
        preferCanvas: true
      }).setView([40.7128, -74.0060], 12);

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        className: 'map-tiles'
      }).addTo(map);

      map.on('click', handleMapClick);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          map.setView([pos.coords.latitude, pos.coords.longitude], 14);
        });
      }
    }

    function setPickingMode(mode) {
      pickingMode = mode;
      document.getElementById('driver' + (mode === 'start' ? 'Start' : 'End')).placeholder =
        'Click on the map to select location...';
    }

    function handleMapClick(e) {
      if (!pickingMode) {
        // Simply ignore clicks when no field is selected - smooth UX
        return;
      }

      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`)
        .then(res => res.json())
        .then(data => {
          const address = data.display_name || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
          setLocation(pickingMode, lat, lng, address);
        });
    }

    function setLocation(type, lat, lng, address) {
      const location = { lat, lng, address };

      if (type === 'start') {
        startLocation = location;
        document.getElementById('driverStart').value = address;

        if (startMarker) map.removeLayer(startMarker);
        startMarker = L.circleMarker([lat, lng], {
          radius: 12,
          fillColor: '#3b82f6',
          color: '#fff',
          weight: 3,
          fillOpacity: 1
        }).addTo(map).bindPopup('📍 Pickup').openPopup();

        updateRadiusCircle();

      } else {
        endLocation = location;
        document.getElementById('driverEnd').value = address;

        if (endMarker) map.removeLayer(endMarker);
        endMarker = L.circleMarker([lat, lng], {
          radius: 12,
          fillColor: '#10b981',
          color: '#fff',
          weight: 3,
          fillOpacity: 1
        }).addTo(map).bindPopup('🎯 Destination');
      }

      if (startLocation && endLocation) {
        drawRoute();
      }

      pickingMode = null;
    }

    function useMyLocation() {
      if (!navigator.geolocation) {
        alert('Geolocation not supported');
        return;
      }

      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        map.setView([lat, lng], 14);

        fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`)
          .then(res => res.json())
          .then(data => {
            setLocation('start', lat, lng, data.display_name);
          });
      });
    }

    function updateRadius(value) {
      document.getElementById('radiusValue').textContent = value + ' km';
      if (startLocation) {
        updateRadiusCircle();
      }
    }

    function updateRadiusCircle() {
      if (!startLocation) return;

      if (radiusCircle) map.removeLayer(radiusCircle);

      const radius = parseFloat(document.getElementById('driverRadius').value) * 1000;
      radiusCircle = L.circle([startLocation.lat, startLocation.lng], {
        radius,
        color: '#10b981',
        fillColor: '#10b981',
        fillOpacity: 0.25,
        weight: 2,
        dashArray: '10, 10'
      }).addTo(map);
    }

    function drawRoute() {
      if (routeLine) map.removeLayer(routeLine);

      routeLine = L.polyline([
        [startLocation.lat, startLocation.lng],
        [endLocation.lat, endLocation.lng]
      ], {
        color: '#10b981',
        weight: 3,
        opacity: 0.7,
        dashArray: '10, 10'
      }).addTo(map);

      map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });
    }

    async function startDriver() {
      if (!startLocation || !endLocation) {
        alert('Please set both pickup and destination!');
        return;
      }

      const radius = parseFloat(document.getElementById('driverRadius').value);

      const res = await fetch('http://localhost:3000/api/live-driver', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: userName,
          phone: userPhone,
          location: startLocation,
          destination: endLocation,
          radiusKm: radius
        })
      });

      const data = await res.json();
      if (res.ok) {
        userId = data.driver.id;
        showStatus(`🚙 You're live! Searching within ${radius}km...`);
        startTracking();
      } else {
        alert('Error starting driver mode: ' + (data.error || 'Unknown error'));
      }
    }

    function startTracking() {
      findMatches();
      updateInterval = setInterval(findMatches, 5000);
    }

    async function findMatches() {
      const radius = parseFloat(document.getElementById('driverRadius').value);

      const res = await fetch(
        `http://localhost:3000/api/live-matches?type=driver&id=${userId}&radius=${radius}`
      );

      const data = await res.json();
      if (res.ok) displayMatches(data.matches);
    }

    function displayMatches(matches) {
      matchMarkers.forEach(m => map.removeLayer(m));
      matchMarkers = [];

      const list = document.getElementById('matchList');

      if (matches.length === 0) {
        list.innerHTML = '<div class="info-pill">No riders nearby yet. Keep driving!</div>';
        return;
      }

      list.innerHTML = matches.map((match, i) => {
        const rider = match.rider;

        const marker = L.circleMarker([rider.location.lat, rider.location.lng], {
          radius: 10,
          fillColor: '#f59e0b',
          color: '#fff',
          weight: 2,
          fillOpacity: 1
        }).addTo(map).bindPopup(`
          <strong>${rider.name}</strong><br>
          📞 ${rider.phone}<br>
          📍 ${match.distance} km away
        `);

        matchMarkers.push(marker);

        return `
          <div class="match-card" onclick="map.setView([${rider.location.lat}, ${rider.location.lng}], 15)">
            <div class="match-header">
              <div class="match-name">${i + 1}. ${rider.name}</div>
              <div class="match-badge">${match.distance} km</div>
            </div>
            <div class="match-info">
              <div>📞 ${rider.phone}</div>
              <div>📍 ${rider.location.address}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function showStatus(msg) {
      document.getElementById('statusCard').style.display = 'block';
      document.getElementById('statusCard').innerHTML = `
        <div class="status-card">
          <div class="status-header">
            <div class="pulse"></div>
            <strong>Live</strong>
          </div>
          <div>${msg}</div>
        </div>
      `;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Testing Google Maps API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 40px;
        }
        #map {
            width: 100%;
            height: 600px;
            background: #333;
            border-radius: 10px;
        }
        .status {
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            background: #242424;
        }
        .error {
            background: #dc2626;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success {
            background: #2f9e44;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🗺️ Google Maps API Test</h1>

    <div class="status">
        <h2>Status:</h2>
        <div id="status">Loading...</div>
    </div>

    <div id="map"></div>

    <script>
        let statusDiv = document.getElementById('status');

        function showStatus(message, isError = false) {
            const div = document.createElement('div');
            div.className = isError ? 'error' : 'success';
            div.textContent = message;
            statusDiv.appendChild(div);
        }

        function initMap() {
            showStatus('✅ Google Maps API loaded successfully!');

            try {
                const map = new google.maps.Map(document.getElementById('map'), {
                    center: { lat: 40.7128, lng: -74.0060 },
                    zoom: 12
                });

                showStatus('✅ Map created successfully!');

                // Add a marker
                const marker = new google.maps.Marker({
                    position: { lat: 40.7128, lng: -74.0060 },
                    map: map,
                    title: 'Test Marker'
                });

                showStatus('✅ Marker added successfully!');
                showStatus('✅ Everything is working! Your API key is valid.');

            } catch (error) {
                showStatus('❌ Error creating map: ' + error.message, true);
            }
        }

        window.initMap = initMap;

        // Error handler
        window.gm_authFailure = function() {
            showStatus('❌ API Key Authentication Failed!', true);
            showStatus('Possible reasons:', true);
            showStatus('1. APIs not enabled in Google Cloud Console', true);
            showStatus('2. API key restrictions are too strict', true);
            showStatus('3. Billing not enabled', true);
        };

        // Check if API key is set
        const apiKey = 'AIzaSyDhsqKqqoNL2t7IyLoPWl2UsHElwZp6yMk';
        showStatus('API Key: ' + apiKey.substring(0, 20) + '...');

        // Load the API
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&callback=initMap&libraries=places`;
        script.async = true;
        script.defer = true;

        script.onerror = function() {
            showStatus('❌ Failed to load Google Maps API script!', true);
        };

        document.head.appendChild(script);
    </script>
</body>
</html>
